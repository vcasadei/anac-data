name: casadei
version: 1
description: Vitor's spec-driven workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      ## Engineering standards

      **Do not invent requirements.** When business logic or an edge case is
      underspecified in the ticket or the prompt, ask the user a clarifying
      question instead of filling the gap with an assumption. An unanswered
      question is a better proposal than a confident guess.

      **Compatibility is a first-class concern.** The project follows semantic
      versioning (`major.minor.patch`), and no API breaks without an explicit
      deprecation cycle. In **What Changes**:
      - Mark every breaking change with **BREAKING**.
      - For each one, state the deprecation path - what keeps working, for how
        long, and what consumers migrate to. A **BREAKING** entry with no
        deprecation path is incomplete.

      **New dependencies need approval.** If the change requires a third-party
      library or package that the project does not already use, name it
      explicitly in **Impact** and ask the user to approve it before it reaches
      design or tasks. Never quietly introduce an unvetted dependency.

      **Impact must also cover**, when the change touches them: personal data
      (LGPD scope), database schema, message consumers or queues, and public
      API surface. These drive design and task requirements downstream.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` in the BDD form below
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - The requirement's body text MUST contain the literal uppercase word
        SHALL or MUST. The validator looks for `\b(SHALL|MUST)\b` in the body,
        not the header - a requirement whose only SHALL sits in its title still
        fails, and under `openspec validate --strict` that warning is fatal.

      **BDD scenario format.** Every scenario names the actor, the trigger, and
      the outcome:
      - `- **AS A** <role or system acting>`
      - `- **WHEN** <trigger or condition>`
      - `- **THEN** <observable, checkable outcome>`
      - `- **AND** <further outcome>` (optional, repeatable)

      The **AS A** line is required: a scenario without an actor tends to
      describe implementation rather than a contract. If a scenario genuinely
      has no actor other than the system itself, say so explicitly
      (`**AS A** the scheduler`), rather than dropping the line.

      Infer realistic happy paths, edge cases, and error modes when the user
      has not supplied them. A requirement whose only scenario is the happy
      path is under-specified - cover at least the failure mode a caller can
      actually hit.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **AS A** signed-in account holder
      - **WHEN** I click the "Export" button
      - **THEN** the system downloads a CSV file with all my data

      #### Scenario: Export requested while one is already running
      - **AS A** signed-in account holder
      - **WHEN** I request an export and a previous export is still running
      - **THEN** the system SHALL return the in-flight export rather than starting a second one
      - **AND** no duplicate export job is enqueued

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      ## Engineering standards

      These are contract-level concerns, so they belong in specs rather than
      design. Write them as requirements whenever the change touches the
      relevant surface - not as a checklist appended to every spec.

      **Resilience and distributed behavior:**
      - Endpoints, webhooks, and asynchronous workers that mutate state or
        drive a state transition SHALL be idempotent. Specify the idempotency
        contract itself (idempotency key, unique constraint, dedup window) and
        a scenario for the repeated-delivery case.
      - Message consumers SHALL enforce a maximum retry count and route
        exhausted messages to a Dead-Letter Queue. Specify the retry ceiling
        and the DLQ destination, with a scenario for retry exhaustion.
      - Behavior that consumers depend on SHALL remain backward compatible.
        When a requirement changes, the spec says what old callers still get.

      **Data protection (LGPD) and observability:**
      - Personal data SHALL be minimized and bounded by a stated retention
        period. Name the retention window in the requirement - "retained
        indefinitely" is not a retention policy.
      - Personal data (CPF, RG, email, phone) and credentials or tokens SHALL
        NOT appear in logs, metrics, or telemetry. When a requirement produces
        observable output over personal data, specify the masking or redaction
        as part of the contract.
      - Business-critical transactions SHALL propagate a correlation ID and
        OpenTelemetry-compatible tracing headers. Where traceability is part of
        what a consumer relies on, make it a requirement with a scenario.

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      ## Engineering standards

      **Design for the requirement in front of you.** Prefer the direct,
      idiomatic solution. Do not design premature abstractions, generic
      wrappers, or factory patterns where a plain function suffices - if the
      design introduces an abstraction, **Decisions** must say which concrete
      second use case justifies it. "We might need it later" does not.

      **Ground the design in what already exists.** Before proposing a new
      pattern, identify the project's established conventions, error-handling
      wrappers, and logging approach, and follow them. A deliberate departure
      belongs in **Decisions** with its rationale; an accidental one is a bug.

      **Dependencies.** Any third-party library not already used by the project
      must be listed in **Decisions** with the alternatives considered and must
      have been approved by the user at proposal time. If it was not, stop and
      ask now.

      **Migration Plan is mandatory when the change alters a database schema.**
      It must specify:
      - An expand-and-contract sequence achieving zero downtime - expand
        (add the new shape, dual-write), migrate, contract (drop the old shape)
        as separately deployable steps.
      - A functional `down` migration for every step. A migration without a
        tested rollback is not finished.

      **Feature flags.** High-risk workflows and significant refactors must be
      decoupled from deployment behind a flag. State the flag name, its default
      value, and the removal criteria - a flag with no removal plan is debt.

      **Security and observability decisions** belong here when they involve a
      technical choice rather than a behavioral contract:
      - Where secrets come from. Configuration loads strictly from environment
        variables or a secret vault; there are no hardcoded credentials or test
        tokens, in any file, including tests and fixtures.
      - How personal data is masked or redacted before it reaches logs,
        metrics, or telemetry.
      - How correlation IDs and OpenTelemetry tracing headers propagate across
        service and queue boundaries.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      ## Engineering standards

      Some work is not optional, and the task list is where it becomes visible.
      Include these as real, checkable tasks whenever the change touches the
      relevant surface - never as a trailing "also write tests" afterthought.

      **Testing is not a follow-up.**
      - Every feature and every fix MUST have at least one task producing an
        automated test - unit, integration, or contract (e.g. Pact).
      - Each BDD scenario in the specs is a candidate test case. Tasks should
        map onto scenarios so coverage of the contract is traceable.
      - New code MUST maintain or raise the repository's existing coverage
        threshold. If the change could lower it, add an explicit task to
        confirm the threshold still passes.

      **Database changes carry their own tasks.** A schema alteration needs a
      separate task per expand-and-contract step, plus a task that exercises
      the `down` migration and verifies the rollback actually restores the
      prior shape. "Write migration" alone is not sufficient.

      **Documentation ships with the code, not after it.** When the change
      alters behavior, configuration, or a public interface, include a task to
      update the Markdown under `/docs/` in the same commit or MR as the
      implementation. Documentation is written in Portuguese (PT-BR) by
      default unless the user says otherwise, and favors tables, bulleted
      technical specs, and interface schemas over prose - overview sections
      capped at 2-3 short paragraphs.

      **Quality gates close the list.** The final task group MUST verify the
      branch is review-ready: the project compiles cleanly, and static
      analysis, strict type checking, and the linter all pass. Name the actual
      commands the project uses rather than describing them generically.

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    ## Authorship

    The human developer is the author of this work. Commits, merge requests,
    code comments, and documentation attribute them and no one else. Never add
    an AI signature, a `Co-authored-by:` trailer naming an AI or assistant, or
    any other generative metadata to a commit message, MR description, or file.

    ## Branching

    Never commit directly to `main` unless the user explicitly asks for it.
    Before starting implementation, if the work is not already on a suitable
    branch, ask the user for the ticket ID and a brief title, then branch as:

        <type>/<JIRA-KEY>-<kebab-case-title>

    for example `feat/PROJ-104-auth-flow` or `fix/PAY-882-retry-timeout`.
    Ask rather than inventing a ticket ID - a fabricated key is worse than a
    paused task.

    ## Commits

    Follow Conventional Commits: `type(scope): imperative summary`. Keep branch
    history linear - rebase rather than merge, and squash noise before the
    branch is offered for review.

    ## Scope discipline

    Touch only the files the current task requires. Do not refactor code the
    task does not touch, reformat unrelated regions, or adjust whitespace
    outside the change. An unrelated improvement you notice is worth
    mentioning to the user; it is not worth putting in this diff.

    ## Code standards

    Write clean, idiomatic code that matches what the project already does -
    its conventions, its error-handling wrappers, its logging. Prefer the
    direct solution: no premature abstractions, generic wrappers, or factory
    patterns where a function suffices.

    Never introduce a third-party library or package that the project does not
    already use without the user's explicit approval.

    Every class, interface, method, and exported function carries a concise
    docblock in the language's standard form - JSDoc/TSDoc for TypeScript,
    Google style for Python, Javadoc for Java:
    - State the core responsibility in 1-2 sentences.
    - Document each parameter (`@param` / `Args:`) with type, name, and role.
    - Document the return value (`@returns` / `Returns:`) with type and role.
    - Document raised or thrown errors (`@throws` / `Raises:`).

    Do not write narrative inline comments that restate the syntax. A comment
    earns its place by explaining why, not what.

    ## Secrets

    No hardcoded credentials or tokens, including in tests and fixtures.
    Configuration loads strictly from environment variables or a secret vault.
    Personal data and credentials never reach logs, metrics, or telemetry.

    ## Documentation

    When a task changes behavior, configuration, or a public interface, update
    the Markdown under `/docs/` in the same commit as the implementation -
    not as a follow-up. Write it in Portuguese (PT-BR) unless the user says
    otherwise, and keep it scannable: tables, bulleted technical specs, and
    interface schemas rather than prose, with overviews held to 2-3 short
    paragraphs.

    ## Ambiguity

    When business logic or an edge case is underspecified, ask the user a
    clarifying question. Do not invent the requirement and proceed.

    ## Before declaring the branch ready

    The code compiles cleanly and passes static analysis, strict type checking,
    and the linter. Run the project's actual commands and report real output.
    If a gate fails, say so plainly rather than describing the work as done.
